<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阿香師油飯點餐系統</title>
  <!-- 載入 CSS 樣式 -->
  <link rel="stylesheet" href="style.css" />
  <!-- Google 驗證碼，用於站長工具驗證 -->
  <meta name="google-site-verification" content="OpGtDpsQeFzHr7mj-9mKTgLOQagVNjbFdUuopoBPJyk" />
  <link rel="shortcut icon" href="logo.ico"/>
</head>
<body>
  <!-- banner_頂部區塊 -->
  <div class="banner">
    <img src="logo.jpg" class="banner-img" alt="店家 Logo">
    <div class="overlay-text">點餐系統</div>
  </div>

  <!-- 流程指示條 -->
  <div id="stepIndicator"></div>
  <!-- menu_菜單區塊 -->
  <div class="menu" id="menuContainer"></div>
  <!-- form_表單區塊 -->
  <div class="form" style="display: none" >
    <div class="form-group">
      <label><span class="required">*</span> 姓名</label>
      <input type="text" id="name" placeholder="請輸入姓名">
    </div>
    <div class="form-group">
      <label><span class="required">*</span> 手機號碼</label>
      <input type="tel" id="phone" placeholder="請輸入手機">
    </div>
    <div class="form-group">
      <label><span class="required">*</span> 取餐日期</label>
      <input type="date" id="pickupDate">
    </div>
    <div class="form-group">
      <label>備註</label>
      <textarea id="note" rows="3"></textarea>
    </div>
    <div class="total">總價格：
      <span id="total">0</span> 元
    </div>
  </div>
  <!-- 歷史紀錄按鈕（固定在右下角） -->
  <div id="historyButton">
    <img src="history.jpg" alt="歷史紀錄">
  </div>
  <!-- 底部流程按鈕 -->
  <div id="footerControls">
    <div class="footer-buttons">
      <button id="backBtn" style="display:none;">返回</button>
      <button id="nextBtn">下一步</button>
      <!-- 社群連結區塊 -->
      <div id="socialLinks" style="flex: 2; display: none; flex-direction: column; align-items: flex-start; font-size: 14px; text-align: left;">
        <div>可以關注我們的社群網站以獲得最新消息哦~</div>
        <div>
          Facebook: <a href="https://www.facebook.com/LuGangAXiangShiYouFan" target="_blank">鹿港阿香師油飯</a><br />
          IG: <a href="https://www.instagram.com/xiang_rice/" target="_blank">@xiang_rice</a>
        </div>
      </div>
    </div>
  </div>
  <!-- 確認訂單區塊（JS動態填入） -->
  <div id="confirmationSection" style="display: none; background: white; padding: 20px; margin: 20px; border-radius: 12px; max-width: 500px; margin-left: auto; margin-right: auto;">
    <h3>確認訂單</h3>
    <div id="confirmDetails"></div>
  </div>
  <!-- 載入視窗 -->
  <div id="loadingModal" class="modal">
    <div class="modal-content">
      <img id="loadingImage" src="loading.gif" alt="載入中">
      <p id="loadingText">訂單處理中，請稍候...</p>
    </div>
  </div>
  <!-- 歷史訂單模態視窗 -->
  <div id="historyModal" class="modal">
    <div class="modal-content">
      <button onclick="closeHistory()">關閉</button>
      <h3>歷史訂單</h3>
      <div id="historyList"></div>
    </div>
  </div>
  <!-- 載入 JavaScript -->
  <script src="script.js"></script>
</body>
</html>
